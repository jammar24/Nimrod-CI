name: Sentinel-CI Automated Quality & Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (high/critical)
        run: npm audit --audit-level=high

      - name: Run Vitest Unit & Integration Suites
        run: npm test
        env:
          NEBIUS_API_KEY: mock-key-for-unit-tests
          TAVILY_API_KEY: mock-key-for-unit-tests

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEBIUS_API_KEY: mock-key-for-ci-build
          TAVILY_API_KEY: mock-key-for-ci-build
