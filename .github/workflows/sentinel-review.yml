name: Sentinel-CI Autonomous Security Review Gate

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  sentinel-review:
    name: Sentinel-CI Agentic SAST & SARIF Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Sentinel-CI Review & Generate SARIF
        id: review
        continue-on-error: true
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci-review.mjs

      - name: Upload Security Findings to GitHub Code Scanning (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sentinel-report.sarif
          category: sentinel-ci-sast

      - name: Post Security Review Verdict on Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('sentinel-report.md')) {
              const reportContent = fs.readFileSync('sentinel-report.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reportContent
              });
            }

      - name: Enforce Security Quality Gate
        if: steps.review.outcome == 'failure'
        run: |
          echo "::error::Sentinel-CI detected critical/high security vulnerabilities. Merge blocked."
          exit 1
